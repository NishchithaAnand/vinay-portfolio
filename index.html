<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vinay is an independent artist in Montréal, working across mediums and styles." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1915" />
    <title>Vinay · Artist, Montréal</title>
    <script>
      // Follow the system theme unless the visitor picked one (mirrors ThemeProvider), before first paint.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
